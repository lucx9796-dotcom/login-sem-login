# Segundos que o pirata tem para logar antes de ser kickado
login-timeout-seconds: 60
# Tentativas erradas de senha antes do kick
max-attempts: 5
# Tamanho minimo da senha
min-password-length: 6
# Pirata que reconectar do mesmo IP em ate X minutos nao precisa logar de novo (0 = desligado)
session-minutes: 0

